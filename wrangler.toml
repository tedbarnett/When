name = "when-org"
compatibility_date = "2026-07-24"
pages_build_output_dir = "public"

# Waitlist storage (KV namespace id is an identifier, not a secret).
[[kv_namespaces]]
binding = "WHEN_WAITLIST"
id = "17ac37c5fa094254b2a4a80cc8241dc5"

# Auth storage: magic-link tokens (15-min TTL). Secrets (SESSION_SECRET,
# GOOGLE_CLIENT_SECRET, RESEND_API_KEY) live in the Pages project env,
# never in this repo.
[[kv_namespaces]]
binding = "WHEN_AUTH"
id = "8a2774ff75e149898dcf46c3b09c9169"

# Calendar overlay: curator hides + in-place edits layered over the static
# JSON (key "cal:teds-nyc"). See functions/_lib/calendar.js.
[[kv_namespaces]]
binding = "WHEN_CAL"
id = "dbc96d435850429a8b9ad2cdd5b50874"

# Event Ideas candidate pool (issue #13): D1 database filled by the
# workers/when-ingest cron Worker, read by /api/cities/nyc/ideas.
# Schema lives in migrations/ (applied via the worker's wrangler.toml).
[[d1_databases]]
binding = "WHEN_EVENTS"
database_name = "when-events"
database_id = "883cbea3-2020-4cec-bdf2-10137399bb84"
